<svg width="1024" height="500" viewBox="0 0 1024 500" xmlns="http://www.w3.org/2000/svg" font-family="'Sora','Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="cbg" cx="0.5" cy="0.40" r="0.78">
      <stop offset="0" stop-color="#16241a"/><stop offset="0.5" stop-color="#0f1620"/><stop offset="1" stop-color="#0a0d13"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7dd34f" stop-opacity="0.5"/><stop offset="0.5" stop-color="#7dd34f" stop-opacity="0.13"/><stop offset="1" stop-color="#7dd34f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chrt" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#8fe85a"/><stop offset="0.6" stop-color="#5fb236"/><stop offset="1" stop-color="#3f9e22"/>
    </linearGradient>
    <filter id="bigGlow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="11"/></filter>
    <filter id="ekgGlow" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="2.5"/></filter>
  </defs>

  <rect width="1024" height="500" fill="url(#cbg)"/>
  <ellipse cx="512" cy="215" rx="330" ry="270" fill="url(#halo)"/>

  <!-- subtle floating coins -->
  <g fill="#7dd34f">
    <circle cx="250" cy="120" r="4" opacity="0.45"/><circle cx="790" cy="110" r="5" opacity="0.4"/>
    <circle cx="300" cy="330" r="3" opacity="0.35"/><circle cx="760" cy="340" r="4" opacity="0.4"/>
  </g>

  <!-- short pulse line entering/leaving the heart sides (contained, fading) -->
  <g opacity="0.55" stroke="#7dd34f" stroke-width="3" fill="none" stroke-linecap="round">
    <line x1="300" y1="215" x2="430" y2="215"/>
    <line x1="595" y1="215" x2="725" y2="215"/>
  </g>

  <!-- HEART -->
  <g transform="translate(512,215)">
    <path filter="url(#bigGlow)" opacity="0.7" transform="translate(-100,-95) scale(4.15)"
      d="M24 42 C24 42 6 30 6 17 C6 10 11 6 17 6 C20.5 6 23 8 24 10 C25 8 27.5 6 31 6 C37 6 42 10 42 17 C42 30 24 42 24 42 Z" fill="#7dd34f"/>
    <path transform="translate(-100,-95) scale(4.15)"
      d="M24 42 C24 42 6 30 6 17 C6 10 11 6 17 6 C20.5 6 23 8 24 10 C25 8 27.5 6 31 6 C37 6 42 10 42 17 C42 30 24 42 24 42 Z" fill="url(#chrt)"/>
    <ellipse cx="-30" cy="-40" rx="34" ry="19" fill="#ffffff" opacity="0.16"/>
  </g>

  <!-- EKG wave INSIDE the heart: green line, red bottom dip -->
  <g filter="url(#ekgGlow)" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="442,212 470,212 486,178 500,212" stroke="#eaffce"/>
    <polyline points="500,212 512,292 524,212" stroke="#ff5252"/>
    <polyline points="524,212 540,178 556,212 582,212" stroke="#eaffce"/>
  </g>
  <g fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="442,212 470,212 486,178 500,212" stroke="#f4ffe6"/>
    <polyline points="500,212 512,292 524,212" stroke="#ff7676"/>
    <polyline points="524,212 540,178 556,212 582,212" stroke="#f4ffe6"/>
  </g>

  <!-- wordmark + AI -->
  <text x="512" y="418" text-anchor="middle" font-size="52" font-weight="800" letter-spacing="-1.5">
    <tspan fill="#e8ecf3">Finance</tspan><tspan fill="#7dd34f">Flow</tspan>
  </text>
  <text x="512" y="454" text-anchor="middle" fill="#8b93a4" font-size="19" font-weight="700" letter-spacing="4">s <tspan fill="#7dd34f">AI</tspan></text>
</svg>
