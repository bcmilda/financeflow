<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FinanceFlow – Grafy výdajů</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700;800&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0d1117; --surface: #161b27; --surface2: #1c2235; --surface3: #222840;
    --border: rgba(255,255,255,0.07); --text1: #e8ecf4; --text2: #7d8aaa; --text3: #4e5a78;
    --income: #06d6a0; --expense: #ff5470; --accent: #6c8eff;
  }
  body { background: var(--bg); color: var(--text1); font-family: 'Instrument Sans', system-ui, sans-serif; min-height: 100vh; padding: 20px 16px; }

  .header { margin-bottom: 20px; }
  .header h1 { font-size: 1.1rem; font-weight: 700; color: var(--text1); margin-bottom: 2px; }
  .header p { font-size: .75rem; color: var(--text2); }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px; }

  /* Tab bar */
  .tabs { display: flex; gap: 3px; margin-bottom: 14px; background: var(--surface3); border-radius: 11px; padding: 3px; }
  .tab { flex: 1; padding: 7px 0; border: none; border-radius: 8px; font-size: .7rem; font-weight: 500; cursor: pointer; transition: all .18s; font-family: inherit; color: var(--text2); background: transparent; }
  .tab.active { background: var(--surface2); color: var(--text1); font-weight: 700; box-shadow: 0 1px 6px rgba(0,0,0,.3); }
  .tab:hover:not(.active) { color: var(--text1); }

  /* Panels */
  .panel { display: none; }
  .panel.active { display: block; }

  /* SVG */
  svg { display: block; width: 100%; overflow: visible; }

  /* Breadcrumb */
  .bc { font-size: .72rem; color: var(--text2); margin-bottom: 6px; min-height: 18px; display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .bc-link { color: var(--income); cursor: pointer; }
  .bc-link:hover { text-decoration: underline; }

  /* Hint */
  .hint { font-size: .65rem; color: var(--text3); margin-top: 6px; }

  /* Legend */
  .legend { display: flex; flex-wrap: wrap; gap: 2px 10px; margin-top: 8px; }
  .legend-item { display: inline-flex; align-items: center; gap: 4px; font-size: .65rem; color: var(--text2); }
  .legend-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .legend-grad { width: 16px; height: 7px; border-radius: 4px; flex-shrink: 0; }

  /* Treemap */
  .treemap { display: flex; flex-direction: column; gap: 4px; }
  .treemap-row { display: flex; gap: 4px; }
  .treemap-cell {
    border-radius: 9px; padding: 9px 11px; display: flex; flex-direction: column;
    justify-content: flex-end; overflow: hidden; transition: filter .18s;
    cursor: default;
  }
  .treemap-cell:hover { filter: brightness(1.2); }
  .treemap-cell .tc-name { font-size: .68rem; font-weight: 600; margin-bottom: 2px; }
  .treemap-cell .tc-amt { font-size: .85rem; font-weight: 800; }
  .treemap-cell .tc-pct { font-size: .62rem; opacity: .65; margin-top: 1px; }

  /* Tooltip */
  #_tt { position: fixed; background: #1a2035; border: 1px solid rgba(255,255,255,.12); border-radius: 9px; padding: 8px 12px; font-size: .76rem; line-height: 1.55; pointer-events: none; z-index: 9999; display: none; max-width: 180px; color: var(--text1); box-shadow: 0 4px 20px rgba(0,0,0,.5); }
</style>
</head>
<body>

<div class="header">
  <h1>📊 Výdaje podle kategorií</h1>
  <p>Duben 2026 · celkem 46 700 Kč</p>
</div>

<div class="card">
  <div class="tabs">
    <button class="tab active" onclick="switchTab('cluster',this)">⬤ Cluster</button>
    <button class="tab" onclick="switchTab('drill',this)">◎ Drill</button>
    <button class="tab" onclick="switchTab('gradient',this)">◑ Gradient</button>
    <button class="tab" onclick="switchTab('treemap',this)">▦ Treemap</button>
  </div>

  <!-- A) CLUSTER -->
  <div class="panel active" id="panel-cluster">
    <div id="cluster-wrap"></div>
    <div class="legend" id="cluster-legend"></div>
    <div class="hint">Hover pro detail · malé bubliny = podkategorie · šedá = sdílená</div>
  </div>

  <!-- B) DRILL -->
  <div class="panel" id="panel-drill">
    <div class="bc" id="drill-bc">📍 Přehled kategorií – klikni pro detail</div>
    <div id="drill-wrap"></div>
  </div>

  <!-- C) GRADIENT -->
  <div class="panel" id="panel-gradient">
    <div id="gradient-wrap"></div>
    <div class="legend" id="gradient-legend"></div>
  </div>

  <!-- D) TREEMAP -->
  <div class="panel" id="panel-treemap">
    <div class="treemap" id="treemap-wrap"></div>
    <div class="legend" id="treemap-legend"></div>
  </div>
</div>

<div id="_tt"></div>

<script>
// ── DATA ──
const CATS = [
  { id:'bydleni',  name:'Bydlení',    color:'#6c8eff', total:18500,
    subs:[{name:'Nájem',val:12000},{name:'Energie',val:4200},{name:'Internet',val:800},{name:'Pojištění',val:1500}] },
  { id:'jidlo',    name:'Jídlo',      color:'#ff6b8a', total:9200,
    subs:[{name:'Supermarket',val:5800},{name:'Bio',val:1100},{name:'Pečivo',val:900},{name:'Pochutiny',val:1400}] },
  { id:'doprava',  name:'Doprava',    color:'#ffd166', total:4800,
    subs:[{name:'Pohonné hmoty',val:2200},{name:'MHD',val:550},{name:'Parkování',val:800},{name:'Servis',val:1250}] },
  { id:'zdravi',   name:'Zdraví',     color:'#a29bfe', total:3200,
    subs:[{name:'Lékárna',val:1200},{name:'Lékař',val:800},{name:'Sport',val:1200}] },
  { id:'zabava',   name:'Zábava',     color:'#ff9f43', total:2900,
    subs:[{name:'Streaming',val:650},{name:'Kino',val:900},{name:'Hry',val:550},{name:'Knihy',val:800}] },
  { id:'restaurace',name:'Restaurace',color:'#06d6a0', total:3200,
    subs:[{name:'Obědy',val:1400},{name:'Večeře',val:900},{name:'Káva',val:900}] },
  { id:'obleceni', name:'Oblečení',   color:'#fd79a8', total:2400,
    subs:[{name:'Oblečení',val:1600},{name:'Obuv',val:800}] },
  { id:'ostatni',  name:'Ostatní',    color:'#74b9ff', total:2500,
    subs:[{name:'Dárky',val:900},{name:'Domácnost',val:1600}] },
];
const TOTAL = CATS.reduce((s,c)=>s+c.total,0);

// Sdílené subkategorie (existují ve více kategoriích)
const SHARED_NAMES = new Set(['MHD','Pečivo','Lékárna']);

// ── UTILS ──
const fmt = n => n.toLocaleString('cs-CZ')+' Kč';
function rgba(hex,a){const r=parseInt(hex.slice(1,3),16)||96,g=parseInt(hex.slice(3,5),16)||165,b=parseInt(hex.slice(5,7),16)||250;return `rgba(${r},${g},${b},${a})`;}
function esc(s){return (s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'");}

// Tooltip
const tt = document.getElementById('_tt');
function tip(el, html) {
  if(!html){tt.style.display='none';return;}
  tt.innerHTML=html; tt.style.display='block';
  const r=el.getBoundingClientRect();
  const tx=Math.min(r.left+r.width/2-tt.offsetWidth/2, window.innerWidth-190);
  tt.style.left=Math.max(8,tx)+'px';
  tt.style.top=(r.top-tt.offsetHeight-10+window.scrollY)+'px';
}
document.addEventListener('scroll',()=>tt.style.display='none');

// Tab switch
function switchTab(id, btn) {
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('panel-'+id).classList.add('active');
  btn.classList.add('active');
}

// ══════════════════════════════════════
// A) CLUSTER – velké kruhy + satelity
// ══════════════════════════════════════
function buildCluster() {
  const wrap = document.getElementById('cluster-wrap');
  const W = wrap.offsetWidth || 320;
  const H = 280, maxV = CATS[0].total;
  const POS=[{x:.18,y:.27},{x:.52,y:.13},{x:.84,y:.27},{x:.12,y:.72},{x:.5,y:.78},{x:.84,y:.72},{x:.34,y:.52},{x:.67,y:.52}];

  let defs='<defs>';
  CATS.forEach((c,i)=>defs+=`<radialGradient id="cg${i}" cx="40%" cy="40%" r="60%"><stop offset="0%" stop-color="${c.color}" stop-opacity="0.32"/><stop offset="100%" stop-color="${c.color}" stop-opacity="0.07"/></radialGradient>`);
  defs+='</defs>';

  let lines='', circles='';
  CATS.forEach((cat,i)=>{
    const p=POS[i]||{x:.5,y:.5};
    const cx=Math.round(p.x*W), cy=Math.round(p.y*H);
    const cr=Math.max(24,Math.min(46,Math.round(24+(cat.total/maxV)*22)));
    const maxSub=Math.max(...cat.subs.map(s=>s.val),1);
    const catTip=`<b>${cat.name}</b><br>${fmt(cat.total)}<br><span style='color:${cat.color}'>${Math.round(cat.total/TOTAL*100)} % výdajů</span>`;

    cat.subs.forEach((sub,j)=>{
      const sr=Math.max(10,Math.min(17,Math.round(10+(sub.val/maxSub)*7)));
      const a=(cat.subs.length===1)?-Math.PI/2:((j/cat.subs.length)*Math.PI*2-Math.PI/2);
      const dist=cr+sr+5;
      const sx=Math.round(cx+Math.cos(a)*dist), sy=Math.round(cy+Math.sin(a)*dist);
      const isShared=SHARED_NAMES.has(sub.name);
      const subTip=`<b>${sub.name}</b><br>${fmt(sub.val)}<br><span style='color:${cat.color}'>${cat.name}</span>${isShared?' · 🔗 sdílená':''}`;

      lines+=`<line x1="${Math.round(cx+Math.cos(a)*cr)}" y1="${Math.round(cy+Math.sin(a)*cr)}" x2="${Math.round(sx-Math.cos(a)*sr)}" y2="${Math.round(sy-Math.sin(a)*sr)}" stroke="${cat.color}" stroke-width="1" stroke-dasharray="3 2" opacity=".3"/>`;
      circles+=`<circle cx="${sx}" cy="${sy}" r="${sr}"
        fill="${rgba(isShared?'#7a8aaa':cat.color,.16)}"
        stroke="${isShared?'#7a8aaa':cat.color}"
        stroke-width="${isShared?1.5:1.2}"
        ${isShared?'stroke-dasharray="4,2"':''}
        onmouseenter="tip(this,'${esc(subTip)}')" onmouseleave="tip(this,'')"/>`;
      if(isShared) circles+=`<circle cx="${sx+sr-3}" cy="${sy-sr+3}" r="3" fill="#7a8aaa" stroke="#0d1117" stroke-width="1.5" pointer-events="none"/>`;
      circles+=`<text x="${sx}" y="${sy+3}" text-anchor="middle" font-size="5.5" fill="${isShared?'#a8adc4':rgba(cat.color,.7)}" pointer-events="none">${sub.name.slice(0,8)}</text>`;
    });

    circles+=`<circle cx="${cx}" cy="${cy}" r="${cr}" fill="url(#cg${i})" stroke="${cat.color}" stroke-width="2.5" style="cursor:pointer"
      onclick="drillTo('${esc(cat.id)}')"
      onmouseenter="tip(this,'${esc(catTip)}')" onmouseleave="tip(this,'')"/>`;
    circles+=`<text x="${cx}" y="${cy-5}" text-anchor="middle" font-size="${Math.max(8,Math.round(cr*.22))}" font-weight="700" fill="${cat.color}" pointer-events="none">${cat.name.slice(0,9)}</text>`;
    circles+=`<text x="${cx}" y="${cy+9}" text-anchor="middle" font-size="${Math.max(7,Math.round(cr*.19))}" fill="${rgba(cat.color,.85)}" pointer-events="none">${(cat.total/1000).toFixed(1)}k</text>`;
  });

  wrap.innerHTML=`<svg viewBox="0 0 ${W} ${H}">${defs}${lines}${circles}</svg>`;

  document.getElementById('cluster-legend').innerHTML=
    CATS.map(c=>`<div class="legend-item"><div class="legend-dot" style="background:${c.color}"></div>${c.name}</div>`).join('');
}

// ══════════════════════════════════════
// B) DRILL-DOWN – 3 úrovně
// ══════════════════════════════════════
let _dl1=null, _dl2=null, _dl2prev=null;

function buildDrill(l1,l2,l2prev) {
  _dl1=l1; _dl2=l2; _dl2prev=l2prev;
  if(!l1) renderDrillL1();
  else if(!l2) renderDrillL2(l1);
  else renderDrillL3(l2,l2prev);
}
function drillTo(id){ buildDrill(id,null,null); switchToPanel('drill'); }
function switchToPanel(id){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('panel-'+id).classList.add('active');
  document.querySelectorAll('.tab')[1].classList.add('active');
}

function renderDrillL1(){
  const wrap=document.getElementById('drill-wrap');
  const W=wrap.offsetWidth||320, H=300, maxV=CATS[0].total;
  const POS=[{x:.2,y:.27},{x:.55,y:.17},{x:.83,y:.3},{x:.13,y:.7},{x:.5,y:.75},{x:.82,y:.7},{x:.34,y:.52},{x:.67,y:.52}];
  let html='';
  CATS.forEach((cat,i)=>{
    const R=Math.round(28+(cat.total/maxV)*40);
    const px=Math.round((POS[i]||{x:.5,y:.5}).x*W), py=Math.round((POS[i]||{x:.5,y:.5}).y*H);
    const tipTxt=`<b>${cat.name}</b><br>${fmt(cat.total)}<br>${Math.round(cat.total/TOTAL*100)} %<br><span style='color:#7d8aaa'>Klikni pro detail</span>`;
    html+=`<circle cx="${px}" cy="${py}" r="${R}" fill="${rgba(cat.color,.14)}" stroke="${cat.color}" stroke-width="2"
      style="cursor:pointer;transition:fill .15s"
      onclick="buildDrill('${esc(cat.id)}',null,null)"
      onmouseenter="this.style.fill='${rgba(cat.color,.3)}';tip(this,'${esc(tipTxt)}')"
      onmouseleave="this.style.fill='${rgba(cat.color,.14)}';tip(this,'')"/>`;
    html+=`<text x="${px}" y="${py-5}" text-anchor="middle" fill="${cat.color}" font-size="${Math.max(9,Math.round(R*.22))}" font-weight="700" pointer-events="none">${cat.name}</text>`;
    html+=`<text x="${px}" y="${py+9}" text-anchor="middle" fill="${rgba(cat.color,.8)}" font-size="${Math.max(8,Math.round(R*.18))}" pointer-events="none">${(cat.total/1000).toFixed(1)}k</text>`;
  });
  wrap.innerHTML=`<svg viewBox="0 0 ${W} ${H}">${html}</svg>`;
  document.getElementById('drill-bc').innerHTML='📍 Přehled kategorií – klikni pro detail';
}

function renderDrillL2(catId){
  const cat=CATS.find(c=>c.id===catId);
  if(!cat){buildDrill(null,null,null);return;}
  const wrap=document.getElementById('drill-wrap');
  const W=wrap.offsetWidth||320, H=300, cx=W/2, cy=H/2+5, R=62;
  let html='';
  const n=Math.max(cat.subs.length,1);
  cat.subs.forEach((sub,si)=>{
    const a=(si/n)*Math.PI*2-Math.PI/2;
    const subR=Math.max(20,Math.min(30,Math.round(18+(sub.val/cat.total)*38)));
    const dist=R+subR+12;
    const sx=Math.round(cx+Math.cos(a)*dist), sy=Math.round(cy+Math.sin(a)*dist);
    const isS=SHARED_NAMES.has(sub.name);
    const pct=Math.round(sub.val/cat.total*100);
    const tipTxt=`<b>${sub.name}</b><br>${fmt(sub.val)} · ${pct} %<br><span style='color:${cat.color}'>${cat.name}</span>${isS?'<br>🔗 sdílená s více kat.':''}`;
    html+=`<line x1="${Math.round(cx+Math.cos(a)*R)}" y1="${Math.round(cy+Math.sin(a)*R)}" x2="${Math.round(sx-Math.cos(a)*subR*.6)}" y2="${Math.round(sy-Math.sin(a)*subR*.6)}" stroke="${cat.color}" stroke-width="1" stroke-dasharray="3 2" opacity=".4"/>`;
    if(isS){
      html+=`<circle cx="${sx}" cy="${sy}" r="${subR}" fill="${rgba(cat.color,.2)}" stroke="${cat.color}" stroke-width="2" stroke-dasharray="4 2" style="cursor:pointer"
        onclick="buildDrill('${esc(cat.id)}','${esc(sub.name)}','${esc(cat.id)}')"
        onmouseenter="tip(this,'${esc(tipTxt)}')" onmouseleave="tip(this,'')"/>`;
      html+=`<text x="${sx}" y="${sy-5}" text-anchor="middle" fill="${cat.color}" font-size="8" font-weight="700" pointer-events="none">${sub.name.slice(0,11)}</text>`;
      html+=`<text x="${sx}" y="${sy+6}" text-anchor="middle" fill="${rgba(cat.color,.7)}" font-size="7" pointer-events="none">🔗 sdílené</text>`;
    } else {
      html+=`<circle cx="${sx}" cy="${sy}" r="${subR}" fill="${rgba(cat.color,.13)}" stroke="${cat.color}" stroke-width="1.5"
        onmouseenter="tip(this,'${esc(tipTxt)}')" onmouseleave="tip(this,'')"/>`;
      html+=`<text x="${sx}" y="${sy}" text-anchor="middle" dominant-baseline="middle" fill="${cat.color}" font-size="8" pointer-events="none">${sub.name.slice(0,11)}</text>`;
    }
  });
  if(!cat.subs.length) html+=`<text x="${cx}" y="${cy+R+24}" text-anchor="middle" fill="rgba(255,255,255,.3)" font-size="9">Žádné podkategorie</text>`;
  html+=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="${rgba(cat.color,.18)}" stroke="${cat.color}" stroke-width="2.5"/>`;
  html+=`<text x="${cx}" y="${cy-8}" text-anchor="middle" fill="${cat.color}" font-size="13" font-weight="700" pointer-events="none">${cat.name}</text>`;
  html+=`<text x="${cx}" y="${cy+10}" text-anchor="middle" fill="${rgba(cat.color,.8)}" font-size="10" pointer-events="none">${fmt(cat.total)}</text>`;
  wrap.innerHTML=`<svg viewBox="0 0 ${W} ${H}">${html}</svg>`;
  const hint=cat.subs.some(s=>SHARED_NAMES.has(s.name))?'<div class="hint">🔗 přerušovaný okraj = sdílená, klikni pro detail</div>':'';
  wrap.innerHTML+=hint;
  document.getElementById('drill-bc').innerHTML=`📍 <span class="bc-link" onclick="buildDrill(null,null,null)">Kategorie</span> › <b style="color:${cat.color}">${cat.name}</b>`;
}

function renderDrillL3(subName, prevCatId){
  // Najdi všechny kategorie které mají tuto subkategorii
  const entries=CATS.filter(c=>c.subs.some(s=>s.name===subName)).map(c=>({
    cat:c, val:c.subs.find(s=>s.name===subName).val
  }));
  if(!entries.length){buildDrill(_dl2prev,null,null);return;}
  const wrap=document.getElementById('drill-wrap');
  const W=wrap.offsetWidth||320, H=280, cx=W/2, cy=H/2;
  const tot=entries.reduce((s,e)=>s+e.val,0);
  const prevCat=CATS.find(c=>c.id===prevCatId);
  let html='';
  entries.forEach((e,ci)=>{
    const a=(ci/entries.length)*Math.PI*2-Math.PI/2, dist=110, R=36;
    const px=Math.round(cx+Math.cos(a)*dist), py=Math.round(cy+Math.sin(a)*dist);
    const tipTxt=`<b>${e.cat.name}</b><br>${fmt(e.val)} v této kat.<br><span style='color:#7d8aaa'>Klikni pro detail</span>`;
    html+=`<line x1="${Math.round(cx+Math.cos(a)*42)}" y1="${Math.round(cy+Math.sin(a)*42)}" x2="${Math.round(px-Math.cos(a)*R*.7)}" y2="${Math.round(py-Math.sin(a)*R*.7)}" stroke="${e.cat.color}" stroke-width="1.5" stroke-dasharray="5 3" opacity=".45"/>`;
    html+=`<circle cx="${px}" cy="${py}" r="${R}" fill="${rgba(e.cat.color,.18)}" stroke="${e.cat.color}" stroke-width="2" style="cursor:pointer"
      onclick="buildDrill('${esc(e.cat.id)}',null,null)"
      onmouseenter="tip(this,'${esc(tipTxt)}')" onmouseleave="tip(this,'')"/>`;
    html+=`<text x="${px}" y="${py-5}" text-anchor="middle" fill="${e.cat.color}" font-size="10" font-weight="700" pointer-events="none">${e.cat.name}</text>`;
    html+=`<text x="${px}" y="${py+8}" text-anchor="middle" fill="${rgba(e.cat.color,.7)}" font-size="8" pointer-events="none">${fmt(e.val)}</text>`;
  });
  html+=`<circle cx="${cx}" cy="${cy}" r="40" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.25)" stroke-width="2"/>`;
  html+=`<text x="${cx}" y="${cy-6}" text-anchor="middle" fill="white" font-size="11" font-weight="700" pointer-events="none">🔗 ${subName}</text>`;
  html+=`<text x="${cx}" y="${cy+8}" text-anchor="middle" fill="rgba(255,255,255,.65)" font-size="9" pointer-events="none">${fmt(tot)} celkem</text>`;
  wrap.innerHTML=`<svg viewBox="0 0 ${W} ${H}">${html}</svg>`;
  document.getElementById('drill-bc').innerHTML=`📍 <span class="bc-link" onclick="buildDrill(null,null,null)">Kategorie</span> › <span class="bc-link" onclick="buildDrill('${esc(prevCatId)}',null,null)">${prevCat?.name||'Zpět'}</span> › <b style="color:#a8adc4">🔗 ${subName}</b>`;
}

// ══════════════════════════════════════
// C) GRADIENT – sdílené na ose
// ══════════════════════════════════════
function buildGradient(){
  const wrap=document.getElementById('gradient-wrap');
  const W=wrap.offsetWidth||320, H=330, n=Math.min(CATS.length,6);

  // Pozice kategorií – kruh nahoře
  const catPos=CATS.slice(0,n).map((cat,i)=>{
    const a=(i/n)*Math.PI*2-Math.PI/2;
    return {x:Math.round(W/2+Math.cos(a)*W*.29), y:Math.round(H*.44+Math.sin(a)*H*.26), cat};
  });

  // Sdílené subkategorie – bubliny na ose dole
  const sharedCats=[
    {name:'MHD',     cats:['doprava','jidlo'],      color1:'#ffd166',color2:'#ff6b8a', amt:550},
    {name:'Pečivo',  cats:['jidlo','zdravi'],        color1:'#ff6b8a',color2:'#a29bfe', amt:900},
    {name:'Lékárna', cats:['zdravi','doprava'],      color1:'#a29bfe',color2:'#ffd166', amt:1200},
  ];
  const axisY=H-30;
  const shPos=sharedCats.map((s,i)=>({
    x:Math.round(W*(0.18+i*(0.64/(sharedCats.length-1||1)))),
    y:axisY, s, i
  }));

  let defs='<defs>';
  CATS.slice(0,n).forEach((c,i)=>{
    defs+=`<radialGradient id="gg${i}" cx="40%" cy="40%" r="60%"><stop offset="0%" stop-color="${c.color}" stop-opacity="0.28"/><stop offset="100%" stop-color="${c.color}" stop-opacity="0.06"/></radialGradient>`;
  });
  sharedCats.forEach((s,i)=>{
    defs+=`<linearGradient id="sg${i}" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="${s.color1}"/><stop offset="100%" stop-color="${s.color2}"/></linearGradient>`;
    defs+=`<radialGradient id="sgg${i}" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="${s.color1}" stop-opacity="0.3"/><stop offset="100%" stop-color="${s.color2}" stop-opacity="0"/></radialGradient>`;
  });
  defs+=`<linearGradient id="axisGrad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="rgba(255,255,255,0.03)"/><stop offset="50%" stop-color="rgba(255,255,255,0.18)"/><stop offset="100%" stop-color="rgba(255,255,255,0.03)"/></linearGradient>`;
  defs+=`<filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>`;

  let html=defs;
  const CR=36;

  // Osa
  html+=`<line x1="${W*.05}" y1="${axisY}" x2="${W*.95}" y2="${axisY}" stroke="url(#axisGrad)" stroke-width="6" stroke-linecap="round" opacity=".5"/>`;
  html+=`<line x1="${W*.05}" y1="${axisY}" x2="${W*.95}" y2="${axisY}" stroke="url(#axisGrad)" stroke-width="1.5" stroke-linecap="round"/>`;
  html+=`<text x="${W/2}" y="${axisY-13}" text-anchor="middle" fill="rgba(255,255,255,.22)" font-size="7" letter-spacing="2">SDÍLENÉ VÝDAJE</text>`;

  // Linky kategorie → sdílená
  shPos.forEach(sp=>{
    sp.s.cats.forEach(catId=>{
      const cp=catPos.find(p=>p.cat.id===catId);if(!cp)return;
      const cat=cp.cat;
      const dx=cp.x-sp.x, dy=cp.y-sp.y, dist=Math.sqrt(dx*dx+dy*dy)||1;
      const ex=Math.round(sp.x+(dx/dist)*20), ey=Math.round(sp.y+(dy/dist)*20);
      const sx2=Math.round(cp.x-(dx/dist)*CR), sy2=Math.round(cp.y-(dy/dist)*CR);
      html+=`<line x1="${sx2}" y1="${sy2}" x2="${ex}" y2="${ey}" stroke="${cat.color}" stroke-width="1.5" stroke-dasharray="5 3" opacity=".4"/>`;
      html+=`<circle cx="${ex}" cy="${ey}" r="2.5" fill="${cat.color}" opacity=".65"/>`;
    });
  });

  // Kategorie bubliny
  catPos.forEach((cp,i)=>{
    const tipTxt=`<b>${cp.cat.name}</b><br>${fmt(cp.cat.total)}<br>${Math.round(cp.cat.total/TOTAL*100)} %`;
    html+=`<circle cx="${cp.x}" cy="${cp.y}" r="${CR}" fill="url(#gg${i})" stroke="${cp.cat.color}" stroke-width="2.5"
      onmouseenter="tip(this,'${esc(tipTxt)}')" onmouseleave="tip(this,'')"/>`;
    html+=`<text x="${cp.x}" y="${cp.y-6}" text-anchor="middle" fill="${cp.cat.color}" font-size="11" font-weight="700" pointer-events="none">${cp.cat.name}</text>`;
    html+=`<text x="${cp.x}" y="${cp.y+8}" text-anchor="middle" fill="${rgba(cp.cat.color,.8)}" font-size="9" pointer-events="none">${(cp.cat.total/1000).toFixed(1)}k</text>`;
  });

  // Sdílené bubliny na ose
  shPos.forEach(sp=>{
    const SR=20;
    const tipTxt=`<b>🔗 ${sp.s.name}</b><br>${fmt(sp.s.amt)}<br>${sp.s.cats.map(id=>CATS.find(c=>c.id===id)?.name).join(' + ')}`;
    html+=`<circle cx="${sp.x-SR}" cy="${sp.y}" r="3.5" fill="url(#sg${sp.i})" opacity=".8"/>`;
    html+=`<circle cx="${sp.x+SR}" cy="${sp.y}" r="3.5" fill="url(#sg${sp.i})" opacity=".8"/>`;
    html+=`<circle cx="${sp.x}" cy="${sp.y}" r="${SR+12}" fill="url(#sgg${sp.i})" pointer-events="none"/>`;
    html+=`<circle cx="${sp.x}" cy="${sp.y}" r="${SR}" fill="rgba(255,255,255,.05)" stroke="url(#sg${sp.i})" stroke-width="2.5"
      filter="url(#glow)" style="cursor:default"
      onmouseenter="tip(this,'${esc(tipTxt)}')" onmouseleave="tip(this,'')"/>`;
    html+=`<circle cx="${sp.x}" cy="${sp.y}" r="${SR*.5}" fill="url(#sg${sp.i})" opacity=".22" pointer-events="none"/>`;
    html+=`<text x="${sp.x}" y="${sp.y-5}" text-anchor="middle" fill="white" font-size="7.5" font-weight="700" pointer-events="none">${sp.s.name}</text>`;
    html+=`<text x="${sp.x}" y="${sp.y+6}" text-anchor="middle" fill="rgba(255,255,255,.6)" font-size="7" pointer-events="none">${(sp.s.amt/1000).toFixed(1)}k</text>`;
  });

  wrap.innerHTML=`<svg viewBox="0 0 ${W} ${H}">${html}</svg>`;

  const legCats=CATS.slice(0,n).map(c=>`<div class="legend-item"><div class="legend-dot" style="background:${c.color}"></div>${c.name}</div>`).join('');
  const legShared=sharedCats.map(s=>`<div class="legend-item"><div class="legend-grad" style="background:linear-gradient(90deg,${s.color1},${s.color2})"></div>${s.name}</div>`).join('');
  document.getElementById('gradient-legend').innerHTML=legCats+legShared;
}

// ══════════════════════════════════════
// D) TREEMAP
// ══════════════════════════════════════
function buildTreemap(){
  const sorted=[...CATS].sort((a,b)=>b.total-a.total);
  const big=sorted.filter(c=>c.total/TOTAL>0.1);
  const small=sorted.filter(c=>c.total/TOTAL<=0.1);

  const cell=(cat,minH)=>{
    const pct=Math.round(cat.total/TOTAL*100);
    return `<div class="treemap-cell" style="flex:${Math.max(1,Math.round(cat.total/TOTAL*100))};min-width:${minH>60?65:45}px;min-height:${minH}px;background:${cat.color}18;border:1px solid ${cat.color}44"
      onmouseenter="this.style.background='${cat.color}32';this.style.borderColor='${cat.color}99'"
      onmouseleave="this.style.background='${cat.color}18';this.style.borderColor='${cat.color}44'">
      <div class="tc-name" style="color:${cat.color}">${cat.name}</div>
      <div class="tc-amt" style="color:${cat.color}">${fmt(cat.total)}</div>
      <div class="tc-pct" style="color:${cat.color}">${pct} %</div>
    </div>`;
  };

  const wrap=document.getElementById('treemap-wrap');
  wrap.innerHTML=
    (big.length?`<div class="treemap-row">${big.map(c=>cell(c,78)).join('')}</div>`:'')+
    (small.length?`<div class="treemap-row">${small.map(c=>cell(c,52)).join('')}</div>`:'');

  document.getElementById('treemap-legend').innerHTML=
    sorted.map(c=>`<div class="legend-item"><div class="legend-dot" style="background:${c.color};border-radius:2px"></div>${c.name}</div>`).join('');
}

// ── INIT ──
function initAll(){
  buildCluster();
  renderDrillL1();
  buildGradient();
  buildTreemap();
}

window.addEventListener('load', initAll);
window.addEventListener('resize', ()=>{
  buildCluster();
  if(!_dl1) renderDrillL1();
  else if(!_dl2) renderDrillL2(_dl1);
  else renderDrillL3(_dl2,_dl2prev);
  buildGradient();
  buildTreemap();
});
</script>
