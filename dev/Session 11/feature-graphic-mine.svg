<svg width="1024" height="500" viewBox="0 0 1024 500" xmlns="http://www.w3.org/2000/svg" font-family="'Sora','Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1117"/><stop offset="1" stop-color="#141b25"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#7dd34f" stop-opacity="0.13"/><stop offset="1" stop-color="#7dd34f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#0e1117" stop-opacity="0.82"/><stop offset="0.6" stop-color="#0e1117" stop-opacity="0.62"/><stop offset="1" stop-color="#0e1117" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="heart" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9af06a"/><stop offset="1" stop-color="#5fb236"/>
    </linearGradient>
    <filter id="lineGlow" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="softHeart" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>

  <rect width="1024" height="500" fill="url(#bg)"/>
  <rect width="1024" height="500" fill="url(#glow)"/>

  <!-- price chart background: up=green, down=red -->
  <g filter="url(#lineGlow)" opacity="0.42" stroke-width="8" fill="none" stroke-linecap="round">
    <polyline points="150,350 280,295" stroke="#7dd34f"/>
    <polyline points="280,295 400,360" stroke="#e85d5d"/>
    <polyline points="400,360 512,260" stroke="#7dd34f"/>
    <polyline points="512,260 624,355" stroke="#e85d5d"/>
    <polyline points="624,355 744,230" stroke="#7dd34f"/>
    <polyline points="744,230 874,300" stroke="#e85d5d"/>
  </g>
  <g stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.88">
    <polyline points="150,350 280,295" stroke="#7dd34f"/>
    <polyline points="280,295 400,360" stroke="#e85d5d"/>
    <polyline points="400,360 512,260" stroke="#7dd34f"/>
    <polyline points="512,260 624,355" stroke="#e85d5d"/>
    <polyline points="624,355 744,230" stroke="#7dd34f"/>
    <polyline points="744,230 874,300" stroke="#e85d5d"/>
  </g>
  <g>
    <circle cx="280" cy="295" r="5" fill="#9af06a"/><circle cx="400" cy="360" r="5" fill="#ef6b6b"/>
    <circle cx="512" cy="260" r="6" fill="#9af06a"/><circle cx="624" cy="355" r="5" fill="#ef6b6b"/>
    <circle cx="744" cy="230" r="6" fill="#9af06a"/>
  </g>

  <ellipse cx="512" cy="240" rx="380" ry="190" fill="url(#vig)"/>

  <!-- heart -->
  <g transform="translate(482,120) scale(1.45)">
    <path filter="url(#softHeart)" opacity="0.5" d="M24 42 C24 42 6 30 6 17 C6 10 11 6 17 6 C20.5 6 23 8 24 10 C25 8 27.5 6 31 6 C37 6 42 10 42 17 C42 30 24 42 24 42 Z" fill="#7dd34f"/>
    <path d="M24 42 C24 42 6 30 6 17 C6 10 11 6 17 6 C20.5 6 23 8 24 10 C25 8 27.5 6 31 6 C37 6 42 10 42 17 C42 30 24 42 24 42 Z" fill="url(#heart)"/>
  </g>

  <!-- small wordmark + AI -->
  <text x="512" y="320" text-anchor="middle" font-size="56" font-weight="800" letter-spacing="-1.5">
    <tspan fill="#e8ecf3">Finance</tspan><tspan fill="#7dd34f">Flow</tspan>
  </text>
  <text x="512" y="358" text-anchor="middle" fill="#8b93a4" font-size="20" font-weight="700" letter-spacing="4">s <tspan fill="#7dd34f">AI</tspan></text>
</svg>
