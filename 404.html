<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stránka nenalezena · FinanceFlow</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0f1117;--card:#161a23;--line:#242a37;--text:#e8eaf2;--muted:#a8aec8;--zel:#4ade80}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--text);
       font-family:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.6}
  .box{max-width:460px;text-align:center}
  .logo{font-family:'Syne',sans-serif;font-weight:800;font-size:1.15rem;letter-spacing:-.02em;margin-bottom:28px}
  .logo span{color:var(--zel)}
  h1{font-family:'Syne',sans-serif;font-size:3.6rem;font-weight:800;margin:0;letter-spacing:-.03em}
  h2{font-size:1.15rem;margin:6px 0 10px}
  p{color:var(--muted);font-size:.95rem;margin:0 0 24px}
  .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  a{display:inline-block;padding:11px 20px;border-radius:10px;text-decoration:none;font-weight:600;font-size:.92rem}
  .prim{background:var(--zel);color:#0c1a12}
  .sec{border:1px solid var(--line);color:var(--text)}
  a:focus-visible{outline:2px solid var(--zel);outline-offset:3px}
</style>
</head>
<body>
  <div class="box">
    <div class="logo">Finance<span>Flow</span></div>
    <h1>404</h1>
    <h2>Tuhle stránku neznám</h2>
    <p>Odkaz je nejspíš překlep nebo už neplatí. Zkus to z úvodní stránky nebo rovnou v aplikaci.</p>
    <div class="btns">
      <a class="prim" href="/app">Otevřít aplikaci</a>
      <a class="sec" href="/">Na úvodní stránku</a>
    </div>
  </div>
</body>
</html>
